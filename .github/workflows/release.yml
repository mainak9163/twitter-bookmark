# Builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of the app check these Releases for automatic updates.
#
# To release a new version:
#   npm version patch        # bumps package.json (1.0.0 -> 1.0.1) and creates tag v1.0.1
#   git push --follow-tags
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the Release and upload the installer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and publish installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
