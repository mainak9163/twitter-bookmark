<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; media-src 'self' file:"
    />
    <title>Tweet Archive</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/">
          <img class="brand-mark" src="icon.svg" alt="" width="22" height="22" />
          Tweet Archive
        </a>
        <form id="save-form" class="save-form">
          <div class="paste-field">
            <input
              id="link-input"
              class="paste-input"
              type="text"
              placeholder="Paste a tweet link to save it"
              spellcheck="false"
              autocomplete="off"
              aria-describedby="paste-hint"
            />
            <span class="paste-hint" id="paste-hint" title="Paste a link anywhere in the app to save it">
              <kbd>Ctrl</kbd><kbd>V</kbd> anywhere
            </span>
          </div>
          <button id="save-button" class="btn btn-primary" type="submit">Save</button>
        </form>
      </div>
    </header>

    <main class="content">
      <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
      <div id="view"></div>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="../dist/renderer.js"></script>
  </body>
</html>
