<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:" />
  </head>
  <body>
    <h1>Tweet Archive</h1>
    <input id="link-input" type="text" size="60" placeholder="Paste a tweet link" />
    <button id="save-button">Save</button>
    <p id="status-text"></p>
        <h3>Folders</h3>
    <input id="folder-name" type="text" placeholder="Folder name" />
    <input id="folder-desc" type="text" size="50" placeholder="What kind of posts go here?" />
    <button id="add-folder-button">Add folder</button>
    <ul id="folder-list"></ul>
        <h3>Posts</h3>
    <input id="search-input" type="text" size="40" placeholder="Search text, author, notes" />
    <select id="filter-folder"></select>
        <div id="post-list"></div>

    <script src="../dist/renderer.js"></script>
  </body>
</html>
